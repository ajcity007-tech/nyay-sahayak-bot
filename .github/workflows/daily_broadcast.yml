name: Daily Legal Current Affairs Broadcaster

on:
  schedule:
    # Trigger automatically at 08:00 AM IST (02:30 AM UTC) daily
    - cron: '30 2 * * *'
    
  # Allows manual testing execution via the Actions tab interface
  workflow_dispatch:

jobs:
  broadcast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Project Dependencies
        run: pip install -r requirements.txt

      - name: Execute Broadcaster Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python main.py
