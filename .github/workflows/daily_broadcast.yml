name: Daily Legal Current Affairs Broadcaster

on:
  schedule:
    # Runs automatically every single day at 02:30 UTC (which is exactly 08:00 AM IST)
    - cron: '30 2 * * *'
  workflow_dispatch: # Gives you a single click run button anytime you want a manual push

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Setup Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Network Packages
        run: pip install requests

      - name: Execute Broadcaster Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python bot.py
